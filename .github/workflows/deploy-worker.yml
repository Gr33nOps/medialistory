name: Deploy API Worker

# Vercel deploys the frontend on every push to main; this does the same for
# the API Worker, but only when backend code changes. It runs the tests first
# and checks /ready afterwards.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (a scoped API token with
# Workers Scripts: Edit and Account Settings: Read - never the Global API Key)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job skips with a warning.
on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; the Worker was not deployed."

      - uses: actions/checkout@v7
        if: env.HAS_CF_TOKEN == 'true'

      - uses: actions/setup-node@v7
        if: env.HAS_CF_TOKEN == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: env.HAS_CF_TOKEN == 'true'
        run: npm ci

      - name: Unit + smoke tests
        if: env.HAS_CF_TOKEN == 'true'
        run: npm test

      - name: Worker tests (local workerd)
        if: env.HAS_CF_TOKEN == 'true'
        run: npm run test:worker

      - name: Deploy to production
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env=

      - name: Check /ready
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' https://medialistory-api.gr33nops.workers.dev/ready || true)
            if [ "$code" = "200" ]; then cat /tmp/ready.json; exit 0; fi
            sleep 5
          done
          echo "::error::/ready did not return 200 after deploy (last: $code)"; cat /tmp/ready.json || true; exit 1
